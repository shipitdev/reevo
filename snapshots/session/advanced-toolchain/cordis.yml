# Native inspection, scoped PTC, then native subagents and workflow.
- id: agent-default-model
  name: '@reevo/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@reevo/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@reevo/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-executor-native
  disabled: false

- id: tool-executor-ptc
  disabled: true

- id: system-prompt
  name: '@reevo/dsh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@reevo/dsh-cordis-host-runner'
    - id: cordis-inspect-providers
      name: '@reevo/dsh-tool-cordis/host'
    - id: tool-cordis
      name: '@reevo/dsh-tool-cordis'
    - id: advanced-toolchain-presentation
      name: './presentation.mjs'

# Recorded programs are async function bodies, so replay keeps the per-call runtime.
- id: ptc-runtime
  config:
    executionMode: per-call
