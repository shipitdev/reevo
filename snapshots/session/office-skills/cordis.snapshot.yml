# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@reevo/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@reevo/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@reevo/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@reevo/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: office-kit
      name: '@reevo/dsh-office-kit'
      config:
        outputDirectory: !!js dshHomePath('office-kit', 'outputs')

    - id: tool-office
      name: '@reevo/dsh-tool-office'

    - id: workspace-dependencies
      name: '@reevo/dsh-tool-workspace-dependencies'
      config:
        source: !!js process.cwd() + '/runtime-source'
        root: !!js process.cwd() + '/runtime-installed'

    - id: skill-office
      name: '@reevo/dsh-skill-office'
      disabled: false
      config:
        assetRoot: !!js process.cwd() + '/office-skills'

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true
