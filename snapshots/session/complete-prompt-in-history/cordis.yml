- id: llm-deepseek
  name: '@reevo/dsh-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: agent-default-model
  name: '@reevo/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash

- id: session-persistence-jsonl
  name: '@reevo/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- insert:
    - id: complete-prompt-update
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/complete-prompt-update.ts'
