- id: llm-deepseek
  name: '@reevo/dsh-llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@reevo/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash

- id: session-persistence-jsonl
  name: '@reevo/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: system-prompt
  config:
    personaPrefix: 'Deployment instructions: read task.txt.'
    personaSuffix: Deployment suffix.

- insert:
    - id: llm-replay
      name: '@reevo/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-flash
                systemPromptUpdate: in-history
                inputModalities: [text, image]
    - id: persona-section-overrides
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/persona-section-overrides.ts'
